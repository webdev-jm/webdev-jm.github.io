<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body { background:#05070d; font-family:'Inter',sans-serif; color:#e2e8f0; position:relative; }

  .moon-wrap {
    position:absolute; right:-40px; top:75px;
    width:480px; height:480px; border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 170px 50px rgba(99,102,241,.15);
  }
  .moon-tex {
    position:absolute; inset:0;
    background-image:url('assets/models/moon/textures/moon-diffuse.png');
    /* moon-diffuse.png is a UV atlas (cube-cross), not an equirect map, so a
       plain cover/contain shows the seams. These numbers crop one continuous
       500x500 patch of lunar surface out of the middle horizontal band. */
    background-repeat:no-repeat;
    background-size:1990px 1499px;
    background-position:-1104px -509px;
    filter:brightness(.70) contrast(1.02) saturate(.85);
  }
  .moon-shade {
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 32% 30%, rgba(200,210,235,.20), transparent 46%),
      radial-gradient(circle at 74% 74%, rgba(5,7,13,.97), rgba(5,7,13,.55) 42%, transparent 66%);
  }
  .moon-rim {
    position:absolute; inset:0; border-radius:50%;
    box-shadow:inset 0 0 60px 12px rgba(5,7,13,.75);
  }

  .glow { position:absolute; inset:0; background:radial-gradient(680px 460px at 80% 45%, rgba(99,102,241,.18), transparent 68%); }
  .stars { position:absolute; inset:0; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#818cf8; }

  .wrap {
    position:relative; height:100%; max-width:730px;
    padding:0 80px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .badge {
    display:inline-flex; align-items:center; gap:9px;
    border:1px solid rgba(129,140,248,.32); background:rgba(99,102,241,.10);
    color:#a5b4fc; border-radius:999px; padding:8px 18px;
    font-size:16px; font-weight:500; width:fit-content; margin-bottom:28px;
  }
  .badge s { width:8px; height:8px; border-radius:50%; background:#34d399; }
  h1 {
    font-family:'Space Grotesk',sans-serif;
    font-size:66px; font-weight:600; line-height:1.05; letter-spacing:-.022em; color:#fff;
  }
  h1 span { background-image:linear-gradient(90deg,#818cf8,#c084fc,#f472b6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h2 { font-family:'Space Grotesk',sans-serif; font-size:29px; font-weight:500; color:#cbd5e1; margin-top:16px; letter-spacing:-.01em; }
  p.sub { font-size:20px; color:#94a3b8; margin-top:20px; line-height:1.5; max-width:560px; }
  .tags { display:flex; gap:10px; margin-top:34px; }
  .tags b {
    font-weight:500; font-size:15px; color:#cbd5e1;
    border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04);
    border-radius:8px; padding:7px 14px;
  }
  .url { position:absolute; right:56px; bottom:40px; font-size:16px; color:#64748b; }
</style>
</head>
<body>
  <div class="moon-wrap">
    <div class="moon-tex"></div>
    <div class="moon-shade"></div>
    <div class="moon-rim"></div>
  </div>
  <div class="glow"></div>
  <div class="stars" id="stars"></div>
  <div class="wrap">
    <div class="badge"><s></s>Open to new opportunities</div>
    <h1>John Michael <span>Reñon</span></h1>
    <h2>Web Developer</h2>
    <p class="sub">Building a connected ecosystem of Laravel apps at BEVI &mdash; single sign-on, sales &amp; inventory, AI knowledge tools.</p>
    <div class="tags"><b>PHP</b><b>Laravel</b><b>Livewire</b><b>MySQL</b><b>Three.js</b></div>
  </div>
  <div class="url">webdev-jm.github.io</div>
<script>
  var s = document.getElementById('stars'), h = '', seed = 7;
  function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  for (var i = 0; i < 70; i++) {
    h += '<i style="left:' + (rnd()*100).toFixed(2) + '%;top:' + (rnd()*100).toFixed(2) +
         '%;opacity:' + (0.12 + rnd()*0.45).toFixed(2) + '"></i>';
  }
  s.innerHTML = h;
</script>
</body>
</html>
